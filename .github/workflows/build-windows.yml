# .github/workflows/build-windows.yml
#
# Builds the Windows .exe installer on GitHub's free Windows runner.
# Runs on manual trigger or version tag push.
#
# After a successful run, download the .exe from the Actions tab:
#   GitHub repo -> Actions -> latest run -> Artifacts -> "clip-image-search-windows"

name: Build Windows Installer

on:
  # Manual trigger from the Actions tab UI
  workflow_dispatch:

  # Automatic on version tag push (e.g. git tag v1.0.0 && git push --tags)
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build .exe on Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # 1. Checkout source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node 20 (matches Electron 32's internal Node version)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Cache CLIP model files between runs (~150 MB, no need to re-download)
      - name: Cache CLIP models
        id: cache-models
        uses: actions/cache@v4
        with:
          path: resources/models
          key: clip-models-v1

      # 4. Install dependencies (postinstall runs electron-builder install-app-deps,
      #    which rebuilds native modules for Electron's Node ABI)
      - name: Install dependencies
        run: npm ci
        shell: cmd

      # 5. Download CLIP models if cache missed
      - name: Download CLIP models
        if: steps.cache-models.outputs.cache-hit != 'true'
        run: npm run download-models
        shell: cmd

      # 6. Verify all 7 model files are present
      - name: Verify model files
        run: |
          node -e "const fs=require('fs');const p=require('path');const dir='resources/models';const need=['clip-vision-q.onnx','clip-text-q.onnx','tokenizer.json','tokenizer_config.json','special_tokens_map.json','vocab.json','merges.txt'];for (const f of need){const fp=p.join(dir,f);if(!fs.existsSync(fp)){console.error('MISSING:',f);process.exit(1);}const sz=fs.statSync(fp).size;console.log('OK',f,(sz/1024/1024).toFixed(2)+'MB');}"
        shell: cmd

      # 7. Build the React renderer + Electron .exe installer
      - name: Build Windows installer
        run: npm run build:win
        shell: cmd
        env:
          # electron-builder needs this on CI to avoid trying to sign
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # 8. List output (for debugging build issues)
      - name: List release contents
        run: dir release
        shell: cmd

      # 9. Upload the installer as a downloadable artifact (90-day retention)
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: clip-image-search-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          retention-days: 90
          if-no-files-found: error

      # 10. If this is a tag push, also create a GitHub Release with the .exe
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/latest.yml
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
