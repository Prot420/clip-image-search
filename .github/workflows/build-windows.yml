# .github/workflows/build-windows.yml
#
# Builds the Windows .exe installer on GitHub's free Windows runner.
# Runs on manual trigger or version tag push.
#
# After a successful run, download the .exe from the Actions tab:
#   GitHub repo -> Actions -> latest run -> Artifacts -> "clip-image-search-windows"

name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build .exe on Windows
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Cache SigLIP 2 + Florence-2 model files (~740 MB)
      - name: Cache models
        id: cache-models
        uses: actions/cache@v4
        with:
          path: resources/models
          key: siglip-florence-models-v1

      - name: Install dependencies
        run: npm ci
        shell: cmd

      - name: Download models if cache missed
        if: steps.cache-models.outputs.cache-hit != 'true'
        run: npm run download-models
        shell: cmd

      # Verify all expected files are present
      - name: Verify model files
        run: |
          node -e "const fs=require('fs');const p=require('path');const dir='resources/models';const need=['vision_model.onnx','text_model.onnx','tokenizer.json','tokenizer_config.json','special_tokens_map.json','preprocessor_config.json','config.json','florence_vision_encoder.onnx','florence_embed_tokens.onnx','florence_encoder.onnx','florence_decoder.onnx','florence_tokenizer.json','florence_tokenizer_config.json','florence_config.json','florence_generation_config.json','florence_preprocessor_config.json','florence_vocab.json','florence_merges.txt'];let ok=true;for(const f of need){const fp=p.join(dir,f);if(!fs.existsSync(fp)){console.error('MISSING:',f);ok=false;continue;}const sz=fs.statSync(fp).size;console.log('OK',f,(sz/1024/1024).toFixed(2)+'MB');}if(!ok)process.exit(1);"
        shell: cmd

      - name: Build Windows installer
        run: npm run build:win -- --publish=never
        shell: cmd
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: List release contents
        run: dir release
        shell: cmd

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: clip-image-search-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          retention-days: 90
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/latest.yml
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
